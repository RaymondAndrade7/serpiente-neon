<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Serpiente Neón</title>
<style>
  :root {
    --bg: #07060f;
    --panel: #120f24;
    --text: #e9e6ff;
    --muted: #8a84b8;
    --snake: #39ff14;
    --food: #ff2bd6;
    --gold: #ffd23f;
    --life: #ff3b5c;
    --accent: #00e5ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(ellipse at top, #1a1040 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  main {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  h1 {
    margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 6px var(--accent), 0 0 18px var(--accent);
  }
  .hud {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 18px;
    font-size: 15px; color: var(--muted);
  }
  .hud b { color: var(--text); font-size: 18px; }
  .hud #lives { color: var(--life); text-shadow: 0 0 8px var(--life); letter-spacing: 2px; }
  .hud-btns { display: flex; gap: 6px; }
  .icon-btn {
    font: inherit; font-size: 16px; line-height: 1;
    width: 34px; height: 34px; padding: 0; border: none; border-radius: 8px; cursor: pointer;
    background: #1d1840; color: var(--text); box-shadow: 0 0 0 1px #3a3080;
  }
  #pauseBtn { display: none; }
  .board {
    position: relative;
    width: min(92vw, 68vh, 520px);
    aspect-ratio: 1;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #2a2160, 0 0 30px rgba(0, 229, 255, .25);
    overflow: hidden;
  }
  canvas#game { display: block; width: 100%; height: 100%; background: var(--panel); }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; justify-content: safe center;
    gap: 10px; text-align: center; padding: 14px;
    background: rgba(7, 6, 15, .84);
    backdrop-filter: blur(3px);
    overflow-y: auto;
    touch-action: pan-y; /* la tabla de récords se puede desplazar con el dedo */
  }
  .overlay.hidden, .hidden { display: none !important; }
  .overlay h2 {
    margin: 0; font-size: clamp(22px, 6vw, 34px);
    color: var(--food); text-shadow: 0 0 8px var(--food), 0 0 22px var(--food);
  }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; }
  .legend .f { color: var(--food); }
  .legend .g { color: var(--gold); }
  .legend .l { color: var(--life); }
  .skins-label { font-size: 12px; letter-spacing: 3px; color: var(--accent); margin-top: 4px; }
  .skins {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    width: 100%; max-width: 330px;
  }
  .skin {
    background: #1a1535; color: var(--text); box-shadow: 0 0 0 1px #3a3080;
    border-radius: 8px; padding: 6px 4px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font: inherit; font-size: 11px; letter-spacing: 1px; border: none;
  }
  .skin canvas { width: 84px; height: 22px; display: block; }
  .skin.selected { box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(0, 229, 255, .6); background: #221b48; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .play {
    font: inherit; font-size: 16px; letter-spacing: 2px;
    color: var(--bg); background: var(--snake);
    border: none; border-radius: 8px; padding: 10px 26px; cursor: pointer;
    box-shadow: 0 0 12px var(--snake);
  }
  .ghost {
    font: inherit; font-size: 14px; letter-spacing: 2px;
    color: var(--gold); background: transparent;
    border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    box-shadow: 0 0 0 1px var(--gold);
  }
  button:active { transform: scale(.96); }

  /* Formulario para el nombre */
  .name-form { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 300px; }
  .name-form label { color: var(--gold); font-size: 14px; text-shadow: 0 0 8px rgba(255, 210, 63, .6); }
  .name-form .row { display: flex; gap: 6px; width: 100%; }
  .name-form input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px; /* 16px evita el zoom automático de iOS */
    color: var(--text); background: #1a1535;
    border: none; border-radius: 8px; padding: 10px 12px;
    box-shadow: 0 0 0 1px #3a3080;
    user-select: text; -webkit-user-select: text;
  }
  .name-form input:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
  .name-form .play { padding: 10px 14px; font-size: 14px; }
  .link {
    font: inherit; font-size: 12px; color: var(--muted); background: none; border: none;
    text-decoration: underline; cursor: pointer; padding: 4px;
  }

  /* Tabla de récords */
  .records { border-collapse: collapse; width: 100%; max-width: 320px; font-size: 14px; }
  .records td { padding: 5px 8px; border-bottom: 1px solid #241d4d; }
  .records td:first-child { color: var(--muted); width: 2.5em; text-align: right; }
  .records td:nth-child(2) { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; width: 100%; }
  .records td:last-child { text-align: right; color: var(--snake); font-weight: bold; }
  .records tr.top1 td:first-child { color: var(--gold); }
  .records tr.mine td { background: rgba(0, 229, 255, .12); color: var(--accent); }
  .records .empty td { color: var(--muted); text-align: center; border: none; font-weight: normal; }
  /* En la tabla, los botones van arriba para no tener que desplazarse */
  .overlay.panel-records h2 { order: -3; }
  .overlay.panel-records #msg { order: -2; }
  .overlay.panel-records .actions { order: -1; }

  /* Líder mundial y pestañas de la tabla */
  .leader { color: var(--gold) !important; font-size: 14px !important; text-shadow: 0 0 8px rgba(255, 210, 63, .5); }
  .tabs { display: flex; gap: 6px; }
  .tab {
    font: inherit; font-size: 12px; letter-spacing: 1px; cursor: pointer;
    color: var(--muted); background: #1a1535; border: none; border-radius: 8px; padding: 7px 10px;
    box-shadow: 0 0 0 1px #3a3080;
  }
  .tab.active { color: var(--bg); background: var(--accent); box-shadow: 0 0 10px rgba(0, 229, 255, .6); }
  .overlay.panel-records .tabs { order: -1; }
  #recStatus:empty { display: none; }

  /* Panel de volumen */
  .vol-panel {
    position: fixed; z-index: 10; top: 72px; left: 50%; transform: translateX(-50%);
    width: min(300px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px; border-radius: 12px;
    background: #15112c; box-shadow: 0 0 0 1px #3a3080, 0 10px 40px rgba(0, 0, 0, .6);
    touch-action: manipulation;
  }
  .vol-panel h3 { margin: 0; font-size: 14px; letter-spacing: 3px; color: var(--accent); text-align: center; }
  .vol-row { display: grid; grid-template-columns: 6.5em 1fr 2.5em; align-items: center; gap: 8px; font-size: 13px; }
  .vol-row output { text-align: right; color: var(--muted); }
  .vol-row input { width: 100%; accent-color: var(--accent); }
  .vol-panel .actions .play { padding: 8px 18px; font-size: 14px; }
  .vol-panel .actions .ghost { padding: 8px 12px; font-size: 12px; }

  .touch-hint { display: none; }
  @media (pointer: coarse) {
    main { gap: 10px; padding: 12px 8px; }
    /* Sin cruceta, el tablero aprovecha todo el ancho del teléfono */
    .board { width: min(calc(100vw - 16px), calc(100vh - 150px), 640px); }
    #pauseBtn { display: block; }
    .records td { padding: 4px 8px; font-size: 13px; }
    .keys-hint { display: none; }
    .touch-hint { display: block; }
  }
</style>
</head>
<body>
<main>
  <h1>SERPIENTE NEÓN</h1>
  <div class="hud">
    <span>Puntos <b id="score">0</b></span>
    <span>Récord <b id="best">0</b></span>
    <span>Nivel <b id="level">1</b></span>
    <span>Vidas <b id="lives">♥</b></span>
    <span class="hud-btns">
      <button type="button" class="icon-btn" id="soundBtn" aria-label="Volumen">🔊</button>
      <button type="button" class="icon-btn" id="pauseBtn" aria-label="Pausar">⏸</button>
    </span>
  </div>
  <div class="vol-panel hidden" id="volPanel" role="dialog" aria-label="Volumen">
    <h3>VOLUMEN</h3>
    <div class="vol-row"><label for="musicVol">🎵 Música</label><input type="range" id="musicVol" min="0" max="100" step="5"><output id="musicOut" for="musicVol"></output></div>
    <div class="vol-row"><label for="sfxVol">💥 Efectos</label><input type="range" id="sfxVol" min="0" max="100" step="5"><output id="sfxOut" for="sfxVol"></output></div>
    <div class="actions">
      <button type="button" class="ghost" id="muteBtn">SILENCIAR TODO</button>
      <button type="button" class="play" id="volClose">LISTO</button>
    </div>
  </div>
  <div class="board">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">¿Listo?</h2>
      <p id="msg"></p>
      <p class="leader hidden" id="leader"></p>
      <form class="name-form hidden" id="nameForm" autocomplete="off">
        <label for="nameInput">¡Entraste al top 10! Escribe tu nombre</label>
        <div class="row">
          <input id="nameInput" maxlength="12" placeholder="Tu nombre" enterkeyhint="done" spellcheck="false">
          <button type="submit" class="play">GUARDAR</button>
        </div>
        <button type="button" class="link" id="skipBtn">No guardar</button>
      </form>
      <div class="tabs hidden" id="recTabs">
        <button type="button" class="tab" data-tab="online">🌍 TODOS</button>
        <button type="button" class="tab" data-tab="local">📱 ESTE EQUIPO</button>
      </div>
      <p id="recStatus"></p>
      <table class="records hidden" id="records"><tbody></tbody></table>
      <div class="legend" id="legend">
        <span class="f">● +1</span>
        <span class="g">★ Mega: crece +3</span>
        <span class="l">♥ Vida extra</span>
      </div>
      <div class="skins-label" id="skinsLabel">ELIGE TU SKIN</div>
      <div class="skins" id="skins"></div>
      <div class="actions" id="actions">
        <button type="button" class="play" id="start">JUGAR</button>
        <button type="button" class="ghost" id="recordsBtn">🏆 RÉCORDS</button>
      </div>
      <p class="keys-hint">Flechas/WASD para moverte · Espacio pausa · M silencio · 1–6 cambia skin</p>
      <p class="touch-hint">Desliza el dedo en cualquier parte de la pantalla para moverte</p>
    </div>
  </div>
</main>

<script>
(() => {
  const GRID = 20;
  const START_TICK = 220;    // ms por paso al empezar (lento)
  const MIN_TICK = 60;       // velocidad máxima
  const SPEEDUP_MS = 45000;  // cuanto menor, más rápido acelera con el tiempo
  const LEVEL_MS = 20000;    // cada 20 s de juego sube un nivel
  const MAX_LIVES = 3;
  const SPECIAL_TTL = 55;    // pasos que dura una fruta especial
  const TOP_N = 10;
  const MAX_FLAMES = 900;    // tope de partículas de fuego, para no trabar teléfonos lentos

  // Tabla de récords online (Supabase). Ambos valores son públicos por diseño:
  // la tabla solo permite leer y agregar puntajes (ver supabase/scores.sql).
  const ONLINE = {
    url: 'https://kgipddtplevomanpvtmq.supabase.co',
    key: 'sb_publishable_6MBcu5kCGper96f7WoQEYA_0ls7LDqH',
  };
  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };

  // Cada skin decide el color de un segmento: i = índice, k = 0..1 de cabeza a cola, t = tiempo
  const SKINS = [
    { name: 'Neón',     color: (i, k) => `hsl(${105 + k * 80}, 100%, ${i === 0 ? 62 : 54}%)` },
    { name: 'Arcoíris', color: (i, k, t) => `hsl(${(i * 22 + t / 6) % 360}, 100%, 60%)` },
    { name: 'Lava',     color: (i, k) => `hsl(${48 - k * 48}, 100%, ${i === 0 ? 62 : 55 - k * 10}%)` },
    { name: 'Hielo',    color: (i, k) => `hsl(${185 + k * 40}, 100%, ${i === 0 ? 88 : 76 - k * 16}%)` },
    { name: 'Galaxia',  color: (i, k, t) => `hsl(${265 + k * 60 + Math.sin(t / 300 + i * .6) * 14}, 100%, ${i === 0 ? 74 : 63}%)` },
    { name: 'Tigre',    color: i => i === 0 ? '#ffb347' : (Math.floor((i - 1) / 2) % 2 ? '#3d2400' : '#ff8c1a'),
      flame: i => i % 3 ? '#ff8c1a' : '#ffb347' }, // sus rayas oscuras no darían fuego visible
  ];

  const ITEM_COLORS = { food: '#ff2bd6', mega: '#ffd23f', life: '#ff3b5c' };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), levelEl = $('level'), livesEl = $('lives');
  const overlay = $('overlay'), titleEl = $('title'), msgEl = $('msg'), startBtn = $('start');
  const skinsEl = $('skins'), skinsLabel = $('skinsLabel'), legendEl = $('legend');
  const nameForm = $('nameForm'), nameInput = $('nameInput'), recordsEl = $('records');
  const recordsBtn = $('recordsBtn'), soundBtn = $('soundBtn'), pauseBtn = $('pauseBtn');
  const leaderEl = $('leader'), recTabs = $('recTabs'), recStatusEl = $('recStatus'), volPanel = $('volPanel');

  let snake, dir, queue, food, special, grow, lives, score, best, skin, level, playTime;
  let state, tickMs, acc, last, particles, popups, cell;
  let flames = [], flameAcc = 0;
  let panel = 'menu';       // qué muestra el overlay: menu | over | records | pause
  let pendingScore = null;  // puntaje esperando nombre para la tabla
  let highlight = -1;       // fila recién guardada en la tabla
  let newBest = false;      // la última partida superó el récord
  let pendingLocal = false, pendingOnline = false; // en qué tablas entra el puntaje pendiente
  let recTab = 'online';    // pestaña de la tabla: online | local

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch {} },
  };

  // ---------- Sonido y música (sintetizados con Web Audio, sin archivos) ----------
  const sound = (() => {
    let ac = null, master = null, sfxBus = null, musicBus = null, noise = null;
    let muted = store.get('serpiente-neon-mute') === '1';
    let musicVol = Number(store.get('serpiente-neon-music') ?? 50);
    let sfxVol = Number(store.get('serpiente-neon-sfx') ?? 80);
    if (!Number.isFinite(musicVol)) musicVol = 50;
    if (!Number.isFinite(sfxVol)) sfxVol = 80;

    const midi = m => 440 * 2 ** ((m - 69) / 12);

    function applyVolumes() {
      if (!ac) return;
      const t = ac.currentTime;
      master.gain.setTargetAtTime(muted ? 0 : 1, t, .02);
      musicBus.gain.setTargetAtTime((musicVol / 100) * .45, t, .02);
      sfxBus.gain.setTargetAtTime(sfxVol / 100, t, .02);
    }

    // Los navegadores solo dejan sonar audio después de un toque o tecla
    function unlock() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain();
        sfxBus = ac.createGain();
        musicBus = ac.createGain();
        sfxBus.connect(master);
        musicBus.connect(master);
        master.connect(ac.destination);
        noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        applyVolumes();
        music.start();
      }
      if (ac.state === 'suspended' && !document.hidden) ac.resume();
    }

    function tone(freq, t0, dur, { type = 'square', vol = .08, slide = 0, out = sfxBus } = {}) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g).connect(out);
      o.start(t0);
      o.stop(t0 + dur + .02);
    }

    function hit(t0, dur, vol, filterType, freq) {
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise;
      f.type = filterType;
      f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      src.connect(f).connect(g).connect(musicBus);
      src.start(t0, Math.random() * .5);
      src.stop(t0 + dur + .02);
    }

    // Música: bucle chiptune de 4 compases (La menor: Am – F – C – G) a 16 pasos por compás
    const music = (() => {
      const ROOTS = [45, 41, 48, 43];                         // bajo de cada compás
      const CHORDS = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
      const BASS = [0, 0, 12, 0, 0, 12, 7, 12];               // corcheas
      const _ = null;
      const LEAD = [
        76, _, _, 74, 72, _, 69, _, 72, _, 74, _, 76, _, _, _,
        77, _, _, 76, 74, _, 72, _, 69, _, 72, _, 74, _, _, _,
        76, _, _, 74, 72, _, 76, _, 79, _, _, _, 76, _, 74, _,
        74, _, _, 72, 71, _, 67, _, 71, _, 74, _, 71, _, _, _,
      ];
      let step = 0, loop = 0, nextTime = 0, timer = null;
      let bpm = 132;

      function playStep(i, t) {
        const bar = i >> 4, s = i & 15, len = 60 / bpm / 4;
        // Batería
        if (s === 0 || s === 8 || (loop % 2 && s === 10)) {
          tone(150, t, .14, { type: 'sine', vol: .55, slide: .25, out: musicBus });
        }
        if (s === 4 || s === 12) hit(t, .12, .22, 'bandpass', 1800);
        if (s % 2 === 0) hit(t, .03, s % 4 ? .05 : .03, 'highpass', 7000);
        // Bajo
        if (s % 2 === 0) tone(midi(ROOTS[bar] + BASS[s >> 1]), t, len * 1.8, { type: 'triangle', vol: .3, out: musicBus });
        // Arpegio
        const ch = CHORDS[bar];
        tone(midi([ch[0], ch[1], ch[2], ch[0] + 12][s % 4] + 12), t, len * .8, { vol: .025, out: musicBus });
        // Melodía (descansa un bucle de cada tres, para no cansar)
        const note = LEAD[i];
        if (note && loop % 3 !== 2) {
          let n = 1;
          while (n < 4 && LEAD[i + n] === null && i + n < 64) n++;
          tone(midi(note + (loop % 3 === 1 ? 12 : 0)), t, len * n * .9, { vol: .06, out: musicBus });
        }
      }

      function schedule() {
        if (!ac || ac.state !== 'running') return;
        if (nextTime < ac.currentTime) nextTime = ac.currentTime + .05;
        while (nextTime < ac.currentTime + .15) {
          playStep(step, nextTime);
          nextTime += 60 / bpm / 4;
          step = (step + 1) % 64;
          if (step === 0) loop++;
        }
      }

      return {
        start() { if (!timer) timer = setInterval(schedule, 25); },
        // La música acelera un poco con cada nivel
        setLevel(lv) { bpm = 132 + Math.min(lv - 1, 8) * 5; },
      };
    })();

    const now = () => ac.currentTime;
    const arp = (notes, gap, dur, opts) => notes.forEach((f, i) => tone(f, now() + i * gap, dur, opts));

    const SFX = {
      start:  () => { tone(440, now(), .08); tone(880, now() + .08, .14); },
      eat:    () => tone(620, now(), .09, { slide: 1.7 }),
      mega:   () => arp([523, 659, 784, 1047], .06, .13, { type: 'triangle', vol: .11 }),
      life:   () => { tone(784, now(), .14, { type: 'sine', vol: .14 }); tone(1175, now() + .11, .3, { type: 'sine', vol: .14 }); },
      level:  () => arp([440, 554, 659, 880, 1109], .05, .12, { vol: .07 }),
      hurt:   () => tone(320, now(), .4, { type: 'sawtooth', slide: .3, vol: .1 }),
      over:   () => arp([392, 330, 262, 196], .15, .24, { type: 'triangle', vol: .13 }),
      record: () => arp([523, 659, 784, 1047, 1319], .08, .18, { type: 'triangle', vol: .12 }),
    };

    return {
      unlock,
      play(name) { if (!muted && ac && ac.state === 'running') SFX[name](); },
      setLevel: lv => music.setLevel(lv),
      suspend() { if (ac && ac.state === 'running') ac.suspend(); },
      get muted() { return muted; },
      get musicVol() { return musicVol; },
      get sfxVol() { return sfxVol; },
      setMusicVol(v) { musicVol = v; store.set('serpiente-neon-music', v); applyVolumes(); },
      setSfxVol(v) { sfxVol = v; store.set('serpiente-neon-sfx', v); applyVolumes(); },
      toggle() { muted = !muted; store.set('serpiente-neon-mute', muted ? 1 : 0); applyVolumes(); return muted; },
    };
  })();

  function renderSoundUI() {
    soundBtn.textContent = sound.muted ? '🔇' : '🔊';
    $('muteBtn').textContent = sound.muted ? 'ACTIVAR SONIDO' : 'SILENCIAR TODO';
    $('musicVol').value = sound.musicVol;
    $('sfxVol').value = sound.sfxVol;
    $('musicOut').textContent = sound.musicVol + '%';
    $('sfxOut').textContent = sound.sfxVol + '%';
  }

  // ---------- Tabla de récords ----------
  // Local: guardada en el navegador de cada dispositivo.
  // Online: compartida entre todos, guardada en Supabase (ver ONLINE arriba).
  function loadRecords() {
    try {
      const list = JSON.parse(store.get('serpiente-neon-records') || '[]');
      return Array.isArray(list)
        ? list.filter(r => r && typeof r.name === 'string' && Number.isFinite(r.score)).slice(0, TOP_N)
        : [];
    } catch { return []; }
  }

  const beats = (list, points) => points > 0 && (list.length < TOP_N || points > list[list.length - 1].score);
  const qualifiesLocal = points => beats(loadRecords(), points);
  // Si la tabla online no se pudo cargar, se intenta enviar igual
  const qualifiesOnline = points => online.enabled && points > 0 && (!online.list || beats(online.list, points));

  function addRecord(name, points) {
    const list = loadRecords();
    // Con empate, el récord más antiguo queda arriba
    let pos = list.findIndex(r => points > r.score);
    if (pos === -1) pos = list.length;
    list.splice(pos, 0, { name, score: points, date: Date.now() });
    store.set('serpiente-neon-records', JSON.stringify(list.slice(0, TOP_N)));
    return pos < TOP_N ? pos : -1;
  }

  const online = {
    enabled: Boolean(ONLINE.url && ONLINE.key),
    list: null,      // top 10 de todos (null = aún no cargado)
    loading: false,
    error: false,
    mineId: null,    // id del récord recién enviado, para resaltarlo
  };

  async function api(path, options = {}) {
    const res = await fetch(`${ONLINE.url.replace(/\/$/, '')}/rest/v1/${path}`, {
      ...options,
      headers: { apikey: ONLINE.key, 'Content-Type': 'application/json', ...options.headers },
      signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.status === 204 ? null : res.json();
  }

  async function fetchOnline() {
    if (!online.enabled) return;
    online.loading = true;
    renderRecordsIfOpen();
    try {
      const rows = await api(`scores?select=id,name,score&order=score.desc,created_at.asc&limit=${TOP_N}`);
      online.list = Array.isArray(rows) ? rows : [];
      online.error = false;
    } catch {
      online.error = true;
    }
    online.loading = false;
    renderLeader();
    renderRecordsIfOpen();
  }

  async function submitOnline(name, points) {
    try {
      const rows = await api('scores', {
        method: 'POST',
        headers: { Prefer: 'return=representation' },
        body: JSON.stringify({ name, score: points }),
      });
      online.mineId = rows?.[0]?.id ?? null;
    } catch {
      online.error = true;
    }
    await fetchOnline();
  }

  function renderLeader() {
    const top = online.list?.[0];
    const show = Boolean(top) && (panel === 'menu' || (panel === 'over' && pendingScore === null));
    leaderEl.textContent = top ? `👑 Líder mundial: ${top.name} · ${top.score}` : '';
    leaderEl.classList.toggle('hidden', !show);
  }

  function renderRecordsIfOpen() {
    if (panel === 'records' && !overlay.classList.contains('hidden')) renderRecords();
  }

  function renderRecords() {
    const isOnline = recTab === 'online';
    for (const b of recTabs.querySelectorAll('.tab')) b.classList.toggle('active', b.dataset.tab === recTab);
    recTabs.classList.toggle('hidden', !online.enabled);

    let list, mine, status = '';
    if (isOnline) {
      list = online.list || [];
      mine = r => r.id === online.mineId;
      if (online.loading && !online.list) status = 'Cargando…';
      else if (online.error) status = online.list ? 'Sin conexión: puede no estar al día' : 'No se pudo conectar. Revisa tu internet.';
    } else {
      list = loadRecords();
      mine = (r, i) => i === highlight;
      status = online.enabled ? '' : 'En este dispositivo';
    }
    recStatusEl.textContent = status;

    const body = recordsEl.tBodies[0];
    body.replaceChildren();
    if (!list.length) {
      if (isOnline && (online.loading || online.error)) return;
      const tr = body.insertRow();
      tr.className = 'empty';
      const td = tr.insertCell();
      td.colSpan = 3;
      td.textContent = 'Todavía no hay récords. ¡Sé el primero!';
      return;
    }
    list.forEach((r, i) => {
      const tr = body.insertRow();
      if (i === 0) tr.classList.add('top1');
      if (mine(r, i)) tr.classList.add('mine');
      tr.insertCell().textContent = i === 0 ? '👑' : `${i + 1}.`;
      tr.insertCell().textContent = r.name;
      tr.insertCell().textContent = r.score;
    });
    recordsEl.querySelector('tr.mine')?.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Selector de skins ----------
  const previews = SKINS.map((s, idx) => {
    const btn = document.createElement('button');
    btn.className = 'skin';
    btn.type = 'button';
    const c = document.createElement('canvas');
    const label = document.createElement('span');
    label.textContent = `${idx + 1}. ${s.name}`;
    btn.append(c, label);
    btn.addEventListener('click', () => selectSkin(idx));
    skinsEl.append(btn);
    return { btn, c, cx: c.getContext('2d') };
  });

  function selectSkin(idx) {
    skin = idx;
    store.set('serpiente-neon-skin', idx);
    previews.forEach((p, i) => p.btn.classList.toggle('selected', i === idx));
  }

  function drawPreviews(t) {
    const dpr = window.devicePixelRatio || 1;
    previews.forEach((p, idx) => {
      const w = 84, h = 22;
      if (p.c.width !== w * dpr) { p.c.width = w * dpr; p.c.height = h * dpr; }
      const c = p.cx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, w, h);
      const n = 7, size = 11;
      for (let i = n - 1; i >= 0; i--) {
        const k = i / (n - 1);
        const color = SKINS[idx].color(i, k, t);
        c.shadowColor = color; c.shadowBlur = 6; c.fillStyle = color;
        const x = w - 10 - i * size;
        const y = h / 2 + Math.sin(t / 220 - i * .8) * 3;
        c.beginPath();
        c.arc(x, y, i === 0 ? 5 : 4.4 - k * 1.2, 0, Math.PI * 2);
        c.fill();
      }
    });
  }

  // ---------- Estado del juego ----------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    canvas.width = canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
  }

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    grow = 0;
    lives = 1;
    level = 1;
    playTime = 0;
    special = null;
    tickMs = START_TICK;
    particles = [];
    popups = [];
    flames = [];
    sound.setLevel(1);
    placeFood();
    updateHud();
  }

  // La serpiente arranca lenta y acelera con el tiempo de juego, acercándose a MIN_TICK
  function updateSpeed() {
    tickMs = MIN_TICK + (START_TICK - MIN_TICK) * Math.exp(-playTime / SPEEDUP_MS);
    const newLevel = 1 + Math.floor(playTime / LEVEL_MS);
    if (newLevel > level) {
      level = newLevel;
      updateHud();
      const size = canvas.clientWidth;
      popups.push({ x: size / 2, y: size * .3, text: `¡NIVEL ${level}!`, color: '#00e5ff', life: 1.4, big: true });
      sound.play('level');
      sound.setLevel(level);
      levelUpBurst();
    }
  }

  function freeCells() {
    const taken = new Set(snake.map(s => s.x + ',' + s.y));
    if (food) taken.add(food.x + ',' + food.y);
    if (special) taken.add(special.x + ',' + special.y);
    const free = [];
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        if (!taken.has(x + ',' + y)) free.push({ x, y });
    return free;
  }

  function placeFood() {
    food = null;
    const free = freeCells();
    if (!free.length) return false;
    food = free[Math.floor(Math.random() * free.length)];
    return true;
  }

  function maybeSpawnSpecial() {
    if (special || Math.random() > 1 / 55) return;
    const free = freeCells();
    if (!free.length) return;
    const type = lives < MAX_LIVES && Math.random() < .3 ? 'life' : 'mega';
    special = { ...free[Math.floor(Math.random() * free.length)], type, ttl: SPECIAL_TTL };
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level;
    livesEl.textContent = '♥'.repeat(lives);
  }

  function nextHead(d) {
    return { x: snake[0].x + d.x, y: snake[0].y + d.y };
  }

  // ¿Se puede avanzar en esta dirección sin chocar?
  function isSafe(d) {
    const h = nextHead(d);
    if (h.x < 0 || h.y < 0 || h.x >= GRID || h.y >= GRID) return false;
    const eats = (food && h.x === food.x && h.y === food.y) || (special && h.x === special.x && h.y === special.y);
    const body = grow > 0 || eats ? snake : snake.slice(0, -1);
    return !body.some(s => s.x === h.x && s.y === h.y);
  }

  // Desde el menú o el fin del juego, una flecha o swipe empieza la partida
  // (salvo mientras se escribe el nombre para la tabla)
  function canQuickStart() {
    return (state === 'ready' || state === 'over') && pendingScore === null;
  }

  function turn(name) {
    if (canQuickStart()) start();
    const next = DIRS[name];
    if (state === 'hurt') {
      // Tras perder una vida, la serpiente espera a que elijas una dirección segura
      if (isSafe(next)) {
        dir = next;
        queue = [];
        state = 'playing';
        acc = 0;
        last = performance.now();
      }
      return;
    }
    if (state !== 'playing') return;
    const ref = queue.length ? queue[queue.length - 1] : dir;
    // Evita girar 180° (o repetir la misma dirección)
    if (next.x === -ref.x && next.y === -ref.y) return;
    if (next === ref) return;
    if (queue.length < 3) queue.push(next);
  }

  function step() {
    if (queue.length) dir = queue.shift();

    if (!isSafe(dir)) return crash();

    const head = nextHead(dir);
    snake.unshift(head);

    let eaten = null;
    if (food && head.x === food.x && head.y === food.y) eaten = 'food';
    else if (special && head.x === special.x && head.y === special.y) eaten = special.type;

    if (eaten === 'food') {
      score += 1; grow += 1;
      effect(head, ITEM_COLORS.food, '+1');
      sound.play('eat');
      placeFood();
    } else if (eaten === 'mega') {
      score += 3; grow += 3;
      special = null;
      effect(head, ITEM_COLORS.mega, '+3 ★');
      sound.play('mega');
    } else if (eaten === 'life') {
      score += 1; grow += 1;
      lives = Math.min(MAX_LIVES, lives + 1);
      special = null;
      effect(head, ITEM_COLORS.life, '+1 ♥');
      sound.play('life');
    }

    if (grow > 0) grow--;
    else snake.pop();

    if (eaten) updateHud();
    if (!food && !placeFood() && snake.length >= GRID * GRID) return gameOver(true);

    if (special && --special.ttl <= 0) special = null;
    maybeSpawnSpecial();
  }

  function crash() {
    const head = snake[0];
    burst(head.x, head.y, '#ffffff', 30);
    if (lives > 1 && Object.values(DIRS).some(isSafe)) {
      lives--;
      state = 'hurt';
      queue = [];
      popups.push({ x: (head.x + .5) * cell, y: (head.y + .5) * cell, text: '-1 ♥', color: ITEM_COLORS.life, life: 1 });
      sound.play('hurt');
      updateHud();
    } else {
      gameOver();
    }
  }

  function effect(cellPos, color, text) {
    burst(cellPos.x, cellPos.y, color, 22);
    popups.push({ x: (cellPos.x + .5) * cell, y: (cellPos.y + .5) * cell, text, color, life: 1 });
  }

  function burst(gx, gy, color, count) {
    const cx = (gx + .5) * cell, cy = (gy + .5) * cell;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3.5;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
    }
  }

  // ---------- Fuego: sale de la serpiente desde el nivel 2 y crece con cada nivel ----------
  // Nivel 2: llamitas en la cabeza · 3: cabeza y cuello · 4: medio cuerpo y aura ·
  // 5+: todo el cuerpo con chispas · 7+: chispas de colores
  function flameColorOf(i, k, t) {
    const sk = SKINS[skin];
    return sk.flame ? sk.flame(i) : sk.color(i, k, t);
  }

  function emitFlames(dt, t) {
    const power = Math.min(level - 1, 7);
    if (power < 1 || flames.length > MAX_FLAMES) return;
    flameAcc += dt / 1000 * (25 + power * 35); // partículas por segundo
    const n = snake.length, sc = cell / 20;
    const reach = power === 1 ? 1 : power === 2 ? Math.min(n, 3) : power === 3 ? Math.ceil(n / 2) : n;
    while (flameAcc >= 1) {
      flameAcc--;
      const i = Math.random() < .45 ? 0 : Math.floor(Math.random() * reach);
      const seg = snake[i];
      const cx = (seg.x + .5) * cell + (Math.random() - .5) * cell * .5;
      const cy = (seg.y + .5) * cell + (Math.random() - .5) * cell * .5;
      const back = i === 0 ? 1 + Math.random() * 1.5 : .3; // la cabeza deja estela hacia atrás
      flames.push({
        x: cx, y: cy,
        vx: (-dir.x * back + (Math.random() - .5) * .8) * sc,
        vy: (-dir.y * back - (.6 + Math.random() * (.8 + power * .15))) * sc,
        life: 1,
        decay: .025 + Math.random() * .03,
        size: cell * (.16 + power * .035) * (i === 0 ? 1.25 : 1) * (.7 + Math.random() * .6),
        color: flameColorOf(i, i / Math.max(1, n - 1), t),
      });
      if (power >= 4 && Math.random() < .12 + power * .02) {
        const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 3) * sc;
        flames.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5 * sc,
          life: 1, decay: .02 + Math.random() * .02, size: cell * .07, spark: true,
          color: power >= 6 ? `hsl(${Math.random() * 360}, 100%, 70%)` : '#fff6d0',
        });
      }
    }
  }

  // Explosión de chispas del color de la serpiente al subir de nivel (más grande en cada nivel)
  function levelUpBurst() {
    const t = performance.now(), n = snake.length, sc = cell / 20;
    const count = Math.min(260, 40 + level * 18);
    for (let c = 0; c < count; c++) {
      const i = Math.floor(Math.random() * n), seg = snake[i];
      const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 4) * sc * (1 + level * .1);
      flames.push({
        x: (seg.x + .5) * cell, y: (seg.y + .5) * cell,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: .012 + Math.random() * .015, size: cell * (.1 + Math.random() * .12),
        color: flameColorOf(i, i / Math.max(1, n - 1), t), spark: true,
      });
    }
  }

  function updateFlames() {
    const sc = cell / 20;
    flames = flames.filter(f => {
      f.x += f.vx; f.y += f.vy;
      if (f.spark) f.vy += .06 * sc;           // las chispas caen
      else { f.vy -= .04 * sc; f.vx *= .96; }  // las llamas suben
      f.life -= f.decay;
      return f.life > 0;
    });
  }

  function drawFlames(t) {
    const power = Math.min(level - 1, 7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowBlur = 0;
    // Aura alrededor de la cabeza desde el nivel 4
    if (power >= 3 && (state === 'playing' || state === 'hurt' || state === 'paused')) {
      const h = snake[0], cx = (h.x + .5) * cell, cy = (h.y + .5) * cell;
      const r = cell * (1.2 + power * .25 + Math.sin(t / 120) * .15);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, flameColorOf(0, 0, t));
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.globalAlpha = Math.min(.6, .2 + power * .05);
      ctx.fillStyle = g;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    for (const f of flames) {
      const r = f.spark ? f.size : f.size * (.4 + .6 * f.life);
      ctx.globalAlpha = f.life * (f.spark ? 1 : .55);
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
      ctx.fill();
      if (!f.spark && f.life > .55) { // núcleo blanco caliente
        ctx.globalAlpha = (f.life - .55) * 1.2;
        ctx.fillStyle = '#fffbe6';
        ctx.beginPath();
        ctx.arc(f.x, f.y, r * .4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function start() {
    nameInput.blur();
    reset();
    pendingScore = null;
    highlight = -1;
    state = 'playing';
    overlay.classList.add('hidden');
    acc = 0;
    last = performance.now();
    sound.play('start');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showPanel('pause');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.classList.add('hidden');
      last = performance.now();
    }
  }

  function gameOver(won = false) {
    state = 'over';
    newBest = score > best;
    if (newBest) { best = score; store.set('serpiente-neon-best', best); }
    updateHud();
    pendingLocal = qualifiesLocal(score);
    pendingOnline = qualifiesOnline(score);
    pendingScore = pendingLocal || pendingOnline ? score : null;
    sound.play(pendingScore !== null ? 'record' : 'over');
    showPanel('over', won);
  }

  function saveName(e) {
    e.preventDefault();
    if (pendingScore === null) return;
    const name = nameInput.value.trim().replace(/\s+/g, ' ').slice(0, 12) || 'Anónimo';
    store.set('serpiente-neon-name', name);
    highlight = pendingLocal ? addRecord(name, pendingScore) : -1;
    online.mineId = null;
    if (pendingOnline) submitOnline(name, pendingScore);
    recTab = pendingOnline ? 'online' : 'local';
    pendingScore = null;
    nameInput.blur();
    showPanel('records', false, true);
  }

  // ---------- Overlay ----------
  function showPanel(name, won = false, keepTab = false) {
    panel = name;
    overlay.className = `overlay panel-${name}`;
    const isMenu = name === 'menu';
    const isOver = name === 'over';
    const asking = isOver && pendingScore !== null;

    if (name === 'menu') { titleEl.textContent = '¿Listo?'; msgEl.textContent = ''; }
    if (name === 'pause') { titleEl.textContent = 'Pausa'; msgEl.textContent = 'Toca SEGUIR o pulsa Espacio'; }
    if (name === 'records') {
      titleEl.textContent = '🏆 Récords';
      msgEl.textContent = '';
      if (!keepTab) recTab = online.enabled ? 'online' : 'local';
      if (online.enabled && !keepTab) fetchOnline();
    }
    if (isOver) {
      titleEl.textContent = won ? '¡Llenaste el tablero!' : 'Fin del juego';
      msgEl.textContent = `Puntos: ${score}${newBest ? ' · ¡Nuevo récord! 🎉' : ''}`;
    }
    msgEl.style.display = msgEl.textContent ? '' : 'none';

    nameForm.classList.toggle('hidden', !asking);
    if (asking) {
      nameForm.querySelector('label').textContent = pendingOnline
        ? '¡Entraste al top 10 de todos! Escribe tu nombre'
        : '¡Entraste a tu top 10! Escribe tu nombre';
    }
    recTabs.classList.toggle('hidden', name !== 'records' || !online.enabled);
    if (name !== 'records') recStatusEl.textContent = '';
    recordsEl.classList.toggle('hidden', name !== 'records');
    for (const el of [skinsEl, skinsLabel]) el.classList.toggle('hidden', !(isMenu || (isOver && !asking)));
    legendEl.classList.toggle('hidden', !isMenu);
    $('actions').classList.toggle('hidden', asking);
    recordsBtn.classList.toggle('hidden', name === 'pause');

    startBtn.textContent = name === 'pause' ? 'SEGUIR' : state === 'over' ? 'OTRA VEZ' : 'JUGAR';
    recordsBtn.textContent = name === 'records' ? 'VOLVER' : '🏆 RÉCORDS';

    overlay.classList.remove('hidden');
    overlay.scrollTop = 0;
    if (name === 'records') renderRecords();
    renderLeader();

    if (asking) {
      nameInput.value = store.get('serpiente-neon-name') || '';
      // En el teléfono no se abre el teclado solo: se toca el campo
      if (!matchMedia('(pointer: coarse)').matches) nameInput.focus();
    }
  }

  // ---------- Dibujo ----------
  function glow(color, blur) {
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.fillStyle = color;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function star(cx, cy, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * .45 : r;
      const a = rot + i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
  }

  function heart(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * .6);
    ctx.bezierCurveTo(cx - s * 1.15, cy - s * .05, cx - s * .55, cy - s * .95, cx, cy - s * .38);
    ctx.bezierCurveTo(cx + s * .55, cy - s * .95, cx + s * 1.15, cy - s * .05, cx, cy + s * .6);
    ctx.fill();
  }

  function draw(t) {
    const size = canvas.clientWidth;
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#120f24';
    ctx.fillRect(0, 0, size, size);

    // Cuadrícula tenue
    ctx.strokeStyle = 'rgba(120, 100, 255, .07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      const p = Math.round(i * cell) + .5;
      ctx.moveTo(p, 0); ctx.lineTo(p, size);
      ctx.moveTo(0, p); ctx.lineTo(size, p);
    }
    ctx.stroke();

    // Comida normal pulsante
    if (food) {
      const pulse = .32 + Math.sin(t / 160) * .06;
      glow(ITEM_COLORS.food, 18);
      ctx.beginPath();
      ctx.arc((food.x + .5) * cell, (food.y + .5) * cell, cell * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    // Fruta especial (parpadea cuando está por desaparecer)
    if (special && !(special.ttl < 15 && Math.floor(t / 110) % 2)) {
      const cx = (special.x + .5) * cell, cy = (special.y + .5) * cell;
      const pulse = 1 + Math.sin(t / 130) * .1;
      glow(ITEM_COLORS[special.type], 24);
      if (special.type === 'mega') star(cx, cy, cell * .5 * pulse, t / 600);
      else heart(cx, cy, cell * .48 * pulse);
    }

    // Serpiente (parpadea si acaba de perder una vida)
    if (state === 'hurt') ctx.globalAlpha = Math.sin(t / 70) > 0 ? 1 : .3;
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const k = i / Math.max(1, n - 1);
      const color = SKINS[skin].color(i, k, t);
      glow(color, i === 0 ? 20 : 12);
      const pad = cell * (i === 0 ? .06 : .1 + k * .06);
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * .28);
    }

    // Ojos
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#07060f';
    const h = snake[0], er = cell * .09;
    const ex = dir.y !== 0 ? .22 : 0, ey = dir.x !== 0 ? .22 : 0;
    const fx = dir.x * .18, fy = dir.y * .18;
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.arc((h.x + .5 + fx + ex * sgn) * cell, (h.y + .5 + fy + ey * sgn) * cell, er, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawFlames(t);

    // Partículas
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      glow(p.color, 10);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2 * p.life + .5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Textos flotantes (+1, +3 ★, +1 ♥, ¡NIVEL 2!...)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.font = `bold ${Math.max(12, cell * (p.big ? 1.2 : .7))}px ui-monospace, Menlo, monospace`;
      glow(p.color, 12);
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (state === 'hurt') {
      ctx.fillStyle = 'rgba(7, 6, 15, .55)';
      ctx.fillRect(0, size / 2 - cell * 1.6, size, cell * 3.2);
      glow(ITEM_COLORS.life, 14);
      ctx.font = `bold ${Math.max(14, cell * .85)}px ui-monospace, Menlo, monospace`;
      ctx.fillText('¡Perdiste una vida!', size / 2, size / 2 - cell * .55);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e9e6ff';
      ctx.font = `${Math.max(11, cell * .55)}px ui-monospace, Menlo, monospace`;
      ctx.fillText('Elige una dirección para seguir', size / 2, size / 2 + cell * .6);
    }
  }

  let lastFrame = 0;
  function loop(now) {
    const frameDt = Math.min(now - lastFrame, 100);
    lastFrame = now;
    if (state === 'playing' || state === 'hurt') emitFlames(frameDt, now);
    updateFlames();
    if (state === 'playing') {
      const dt = Math.min(now - last, 250); // evita saltos al volver de otra pestaña
      acc += dt;
      playTime += dt;
      last = now;
      updateSpeed();
      while (acc >= tickMs && state === 'playing') {
        acc -= tickMs;
        step();
      }
    }
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vx *= .93; p.vy *= .93; p.life -= .03;
      return p.life > 0;
    });
    popups = popups.filter(p => { p.y -= .6; p.life -= .018; return p.life > 0; });
    draw(now);
    if (!overlay.classList.contains('hidden')) drawPreviews(now);
    requestAnimationFrame(loop);
  }

  // ---------- Controles ----------
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Escape' && !volPanel.classList.contains('hidden')) { closeVolume(); return; }
    // Escribiendo el nombre o moviendo un control de volumen: las teclas son para ese campo
    if (e.target instanceof HTMLInputElement) return;
    if (KEYMAP[e.code]) { e.preventDefault(); turn(KEYMAP[e.code]); return; }
    if (e.code === 'KeyM') { $('muteBtn').click(); return; }
    const skinsVisible = !skinsEl.classList.contains('hidden') && !overlay.classList.contains('hidden');
    if (skinsVisible && /^Digit[1-6]$/.test(e.code)) { selectSkin(Number(e.code.slice(5)) - 1); return; }
    if (e.code === 'Space' || e.code === 'KeyP') {
      e.preventDefault();
      if (canQuickStart()) start(); else togglePause();
    }
    if (e.code === 'Enter' && canQuickStart()) { e.preventDefault(); start(); }
  });

  // Deslizar en pantallas táctiles: funciona en toda la pantalla y gira en cuanto
  // el dedo recorre SWIPE_MIN px, sin esperar a soltarlo. Se puede encadenar
  // varios giros en un mismo gesto (p. ej. arriba y luego derecha sin levantar el dedo).
  const SWIPE_MIN = 22;
  let swipe = null;
  document.addEventListener('touchstart', e => {
    // Los botones y el campo de nombre se tocan, no se deslizan
    if (e.touches.length !== 1 || e.target.closest('button, input')) { swipe = null; return; }
    const t = e.touches[0];
    swipe = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!swipe) return;
    const playing = state === 'playing' || state === 'hurt';
    if (playing && e.cancelable) e.preventDefault(); // sin scroll ni "pull to refresh" mientras juegas
    if (!playing && !canQuickStart()) return;       // en pausa o escribiendo el nombre, no se mueve nada
    const t = e.touches[0];
    const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    swipe = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  document.addEventListener('touchend', () => { swipe = null; });
  document.addEventListener('touchcancel', () => { swipe = null; });

  // El audio se habilita con el primer toque, clic o tecla
  for (const ev of ['touchend', 'pointerdown', 'keydown']) {
    window.addEventListener(ev, sound.unlock, { passive: true });
  }

  // Si cambias de app o bloqueas el teléfono, el juego se pausa y la música se detiene
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state === 'playing') togglePause();
      sound.suspend();
    } else {
      sound.unlock();
    }
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause(); else start();
  });
  recordsBtn.addEventListener('click', () => {
    if (panel === 'records') showPanel(state === 'over' ? 'over' : 'menu');
    else showPanel('records');
  });
  nameForm.addEventListener('submit', saveName);
  $('skipBtn').addEventListener('click', () => { pendingScore = null; showPanel('over'); });
  // Panel de volumen (al abrirlo durante la partida, el juego se pausa)
  function closeVolume() {
    volPanel.classList.add('hidden');
    soundBtn.focus();
  }
  soundBtn.addEventListener('click', () => {
    sound.unlock();
    if (!volPanel.classList.contains('hidden')) return closeVolume();
    if (state === 'playing') togglePause();
    renderSoundUI();
    volPanel.classList.remove('hidden');
  });
  $('volClose').addEventListener('click', closeVolume);
  $('muteBtn').addEventListener('click', () => {
    sound.unlock();
    sound.toggle();
    renderSoundUI();
  });
  $('musicVol').addEventListener('input', e => { sound.setMusicVol(Number(e.target.value)); renderSoundUI(); });
  $('sfxVol').addEventListener('input', e => { sound.setSfxVol(Number(e.target.value)); renderSoundUI(); });
  $('sfxVol').addEventListener('change', () => sound.play('eat')); // muestra de cómo suena
  recTabs.addEventListener('click', e => {
    const tab = e.target.closest('.tab')?.dataset.tab;
    if (!tab) return;
    recTab = tab;
    renderRecords();
    if (tab === 'online') fetchOnline();
  });
  pauseBtn.addEventListener('click', () => { togglePause(); pauseBtn.blur(); });

  // ---------- Arranque ----------
  const topScore = loadRecords()[0]?.score || 0;
  best = Math.max(Number(store.get('serpiente-neon-best')) || 0, topScore);
  const savedSkin = Number(store.get('serpiente-neon-skin'));
  selectSkin(Number.isInteger(savedSkin) && savedSkin >= 0 && savedSkin < SKINS.length ? savedSkin : 0);
  renderSoundUI();
  state = 'ready';
  reset();
  showPanel('menu');
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(t => { last = lastFrame = t; loop(t); });
  fetchOnline(); // carga el líder mundial para el menú
})();
</script>
</body>
</html>
